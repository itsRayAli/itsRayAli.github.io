<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Manrope, 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Edgewise illustration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1633"/><stop offset="1" stop-color="#0c0b18"/></linearGradient>
    <radialGradient id="glow-a" cx=".15" cy=".05" r=".6"><stop offset="0" stop-color="#ff655e" stop-opacity=".22"/><stop offset="1" stop-color="#ff655e" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-b" cx=".95" cy=".95" r=".6"><stop offset="0" stop-color="#9b7bff" stop-opacity=".2"/><stop offset="1" stop-color="#9b7bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff655e"/><stop offset="1" stop-color="#c98bff"/></linearGradient>
    <linearGradient id="bar-low" x1="0" x2="1"><stop offset="0" stop-color="#ff655e"/><stop offset="1" stop-color="#ff8b72"/></linearGradient>
    <linearGradient id="bar-peer" x1="0" x2="1"><stop offset="0" stop-color="#6f58d8"/><stop offset="1" stop-color="#b28cff"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80" stop-opacity=".35"/><stop offset="1" stop-color="#4ade80" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0v50" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow-a)"/>
  <rect width="1600" height="1000" fill="url(#glow-b)"/>

  <!-- App header -->
  <rect x="90" y="70" width="60" height="60" rx="16" fill="url(#brand)"/>
  <path d="M108 112 122 88l10 14 10-8" fill="none" stroke="#1b1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="104" fill="#f7f5ff" font-size="36" font-weight="800" letter-spacing="-1">Edgewise</text>
  <text x="171" y="130" fill="#948ead" font-size="17" letter-spacing="2.5">ON-DEMAND MARKET RESEARCH</text>
  <rect x="1270" y="74" width="240" height="52" rx="26" fill="#ff655e"/>
  <text x="1390" y="107" fill="#1b1020" font-size="19" font-weight="700" text-anchor="middle">Query markets</text>
  <rect x="1100" y="74" width="150" height="52" rx="26" fill="#ffffff08" stroke="#ffffff26"/>
  <circle cx="1128" cy="100" r="6" fill="#ff655e"/>
  <text x="1145" y="107" fill="#dcd7ea" font-size="18" font-weight="600">Alerts (2)</text>

  <!-- Comparison card -->
  <rect x="90" y="190" width="920" height="740" rx="28" fill="#1a1730" stroke="#ffffff17"/>
  <text x="140" y="262" fill="#f7f5ff" font-size="32" font-weight="700" letter-spacing="-.6">Will the home side win the league?</text>
  <text x="140" y="298" fill="#948ead" font-size="19">3 exchanges · snapshot 14:32 · same contract terms</text>

  <g font-size="20">
    <!-- Exchange A (lowest) -->
    <text x="140" y="398" fill="#dcd7ea" font-weight="600">Exchange A</text>
    <rect x="340" y="378" width="580" height="26" rx="13" fill="#ffffff0d"/>
    <rect x="340" y="378" width="160" height="26" rx="13" fill="url(#bar-low)"/>
    <text x="516" y="399" fill="#ff8b72" font-weight="700">31%</text>
    <rect x="140" y="414" width="118" height="30" rx="15" fill="#ff655e1f" stroke="#ff655e66"/>
    <text x="199" y="435" fill="#ff8b72" font-size="15" font-weight="700" text-anchor="middle">LOWEST ASK</text>

    <!-- Exchange B -->
    <text x="140" y="518" fill="#dcd7ea" font-weight="600">Exchange B</text>
    <rect x="340" y="498" width="580" height="26" rx="13" fill="#ffffff0d"/>
    <rect x="340" y="498" width="348" height="26" rx="13" fill="url(#bar-peer)"/>
    <text x="704" y="519" fill="#d3c4ff" font-weight="700">44%</text>

    <!-- Exchange C -->
    <text x="140" y="638" fill="#dcd7ea" font-weight="600">Exchange C</text>
    <rect x="340" y="618" width="580" height="26" rx="13" fill="#ffffff0d"/>
    <rect x="340" y="618" width="392" height="26" rx="13" fill="url(#bar-peer)"/>
    <text x="748" y="639" fill="#d3c4ff" font-weight="700">47%</text>
  </g>

  <!-- Gap markers -->
  <line x1="500" y1="350" x2="500" y2="690" stroke="#ff655e" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="712" y1="350" x2="712" y2="690" stroke="#b28cff" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="712" y="340" fill="#b28cff" font-size="15" font-weight="700" text-anchor="middle">WEIGHTED PEERS</text>
  <path d="M500 730v-14M500 723h212M712 730v-14" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
  <text x="606" y="772" fill="#f7f5ff" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="-.5">+12.4 pp</text>
  <text x="606" y="800" fill="#948ead" font-size="17" text-anchor="middle">weighted gap</text>
  <text x="340" y="700" fill="#6f6a86" font-size="15">20%</text>
  <text x="920" y="700" fill="#6f6a86" font-size="15" text-anchor="end">60%</text>

  <g font-size="16" font-weight="600">
    <rect x="140" y="850" width="130" height="40" rx="20" fill="#ffffff08" stroke="#ffffff1f"/>
    <text x="205" y="876" fill="#cfc9df" text-anchor="middle">Snapshot</text>
    <rect x="284" y="850" width="170" height="40" rx="20" fill="#ffffff08" stroke="#ffffff1f"/>
    <text x="369" y="876" fill="#cfc9df" text-anchor="middle">Bounded query</text>
    <rect x="468" y="850" width="150" height="40" rx="20" fill="#ffffff08" stroke="#ffffff1f"/>
    <text x="543" y="876" fill="#cfc9df" text-anchor="middle">Cancellable</text>
  </g>

  <!-- Signal card -->
  <rect x="1050" y="190" width="460" height="400" rx="28" fill="#1a1730" stroke="#ff655e55"/>
  <rect x="1090" y="228" width="92" height="32" rx="16" fill="#ff655e"/>
  <text x="1136" y="250" fill="#1b1020" font-size="15" font-weight="800" text-anchor="middle">SIGNAL</text>
  <text x="1090" y="310" fill="#f7f5ff" font-size="28" font-weight="700" letter-spacing="-.5">Price gap flagged</text>
  <text x="1090" y="344" fill="#948ead" font-size="18">Why it qualified</text>
  <g font-size="19" fill="#dcd7ea">
    <circle cx="1102" cy="394" r="12" fill="#4ade8022"/><path d="m1096 394 4 4 8-8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1128" y="401">Identical contract terms</text>
    <circle cx="1102" cy="444" r="12" fill="#4ade8022"/><path d="m1096 444 4 4 8-8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1128" y="451">Fresh two-sided quotes</text>
    <circle cx="1102" cy="494" r="12" fill="#4ade8022"/><path d="m1096 494 4 4 8-8" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1128" y="501">Enough depth to act on</text>
  </g>
  <text x="1090" y="556" fill="#6f6a86" font-size="16">Research lead · before fees · no orders placed</text>

  <!-- Paper portfolio card -->
  <rect x="1050" y="620" width="460" height="310" rx="28" fill="#1a1730" stroke="#ffffff17"/>
  <text x="1090" y="676" fill="#948ead" font-size="16" letter-spacing="2.5">PAPER PORTFOLIO</text>
  <text x="1090" y="730" fill="#f7f5ff" font-size="44" font-weight="800" letter-spacing="-1">$10,000</text>
  <text x="1090" y="762" fill="#948ead" font-size="18">Virtual cash · no real money</text>
  <path d="M1090 880 1140 866 1190 872 1240 850 1290 856 1340 834 1390 842 1440 818 1470 822V900H1090Z" fill="url(#spark)"/>
  <path d="M1090 880 1140 866 1190 872 1240 850 1290 856 1340 834 1390 842 1440 818 1470 822" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
