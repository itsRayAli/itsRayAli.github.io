<text x="94" y="832" fill="#c5b7d9" font-size="22">Search · Bookmark · Reopen</text>
<text x="1345" y="832" fill="#c5b7d9" font-size="20" text-anchor="end">CONCEPT ILLUSTRATION</text>
</g></svg>
